<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" fill="#1E40AF" rx="24"/>
  
  <!-- Pipe icon (simplified) -->
  <g transform="translate(128, 128)">
    <!-- Vertical pipe sections -->
    <rect x="-45" y="-70" width="20" height="60" fill="#60A5FA" rx="4"/>
    <rect x="-45" y="10" width="20" height="60" fill="#60A5FA" rx="4"/>
    
    <!-- Horizontal connecting pipe -->
    <rect x="-45" y="-15" width="90" height="20" fill="#60A5FA" rx="4"/>
    
    <!-- Right vertical pipe -->
    <rect x="25" y="-70" width="20" height="60" fill="#60A5FA" rx="4"/>
    <rect x="25" y="10" width="20" height="60" fill="#60A5FA" rx="4"/>
    
    <!-- Connection nodes -->
    <circle cx="-35" cy="-5" r="8" fill="#3B82F6"/>
    <circle cx="35" cy="-5" r="8" fill="#3B82F6"/>
    
    <!-- Data flow indicators (dots) -->
    <circle cx="-35" cy="-35" r="4" fill="#FCD34D"/>
    <circle cx="-10" cy="-5" r="4" fill="#FCD34D"/>
    <circle cx="15" cy="-5" r="4" fill="#FCD34D"/>
    <circle cx="35" cy="35" r="4" fill="#FCD34D"/>
  </g>
  
  <!-- JobsPipe text -->
  <text x="128" y="200" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">JobsPipe</text>
</svg>
